<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glow { box-shadow: 0 0 20px rgba(0, 245, 255, 0.3); }
  </style>
</head>
<body class="bg-[#0a0a0b] text-white overflow-hidden">

  <nav class="flex justify-between items-center px-8 py-6 opacity-60">
    <div class="text-xl font-bold tracking-tighter">JUNAF</div>
    <div class="text-sm tracking-widest uppercase">Stealth Mode</div>
  </nav>

  <main class="relative flex flex-col items-center justify-center min-h-[80vh] px-4 text-center">
    
    <div class="absolute w-[500px] h-[500px] bg-cyan-500/10 rounded-full blur-[120px] -z-10"></div>

    <h1 class="text-6xl md:text-8xl font-bold tracking-tight mb-6 bg-clip-text text-transparent bg-gradient-to-b from-white to-gray-500">
      Intelligence, <br>
      <span class="italic font-light">distilled.</span>
    </h1>

    <p class="max-w-xl text-gray-400 text-lg md:text-xl font-light leading-relaxed mb-10">
      The next-generation operating layer for complex systems. 
      Junaf strips away the friction of legacy architecture.
    </p>

    <div class="flex flex-col md:flex-row items-center gap-4">
      <input 
        type="email" 
        placeholder="Enter your work email" 
        class="bg-white/5 border border-white/10 px-6 py-3 rounded-full w-72 focus:outline-none focus:border-cyan-400/50 transition-all text-sm"
      >
      <button class="bg-white text-black px-8 py-3 rounded-full font-semibold text-sm hover:bg-cyan-400 transition-all duration-300 glow">
        Request Access
      </button>
    </div>

    <div class="mt-16">
      <a href="#" class="text-xs uppercase tracking-[0.3em] text-gray-600 hover:text-cyan-400 transition-colors">
        Read the Manifesto →
      </a>
    </div>

  </main>

  <div class="absolute bottom-0 left-0 w-full h-32 bg-gradient-to-t from-cyan-500/5 to-transparent border-b border-white/5"></div>

</body>
</html>
