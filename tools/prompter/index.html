<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11120f"><meta name="description" content="JUNAF 提词器：可分页、自动滚动、导入导出 TXT 的本地网页版提词工具。"><title>提词器 — JUNAF Tools</title><link rel="stylesheet" href="/tools/prompter/prompter.css"></head><body>
<a class="skip" href="#stage">跳至提词画面</a><header class="topbar"><a class="mark" href="/tools/">JUNAF<span>.</span> <small>/ TOOLS</small></a><span class="tool-name">提词器 <i>01</i></span><a class="back" href="/tools/">返回 Tools ↗</a></header>
<main><section class="stage" id="stage" aria-label="提词画面"><div class="stage-top"><span>JUNAF / PROMPTER</span><span id="page-counter">01 / 01</span></div><div class="reading" id="reading" tabindex="0" aria-label="提词稿，左右滑动翻页"><div class="script" id="script"></div></div><div class="countdown" id="countdown" hidden></div><div class="stage-hint" id="stage-hint">点击画面显示或隐藏控制栏 · 左右滑动翻页</div></section>
<div class="control-wrap" id="control-wrap"><div class="controls"><div class="transport"><button id="prev" type="button" aria-label="上一页">⏮</button><button id="play" class="play" type="button" aria-label="播放">▶</button><button id="next" type="button" aria-label="下一页">⏭</button><span id="status" role="status">已暂停</span></div><div class="quick-settings"><label>速度 <input id="speed" type="range" min="8" max="100" step="1"><output id="speed-value"></output></label><label>字号 <input id="font-size" type="range" min="28" max="96" step="1"><output id="font-value"></output></label></div><div class="actions"><button id="edit" type="button">编辑稿件</button><button id="settings" type="button">设置</button><button id="fullscreen" type="button">全屏</button></div></div></div>
<div class="help-line"><span>空格：播放／暂停</span><span>← →：翻页</span><span>↑ ↓：调整速度</span><span>稿件仅保存在当前浏览器</span></div></main>
<dialog id="editor"><form method="dialog" class="dialog-shell"><div class="dialog-head"><div><span class="eyebrow">SCRIPT / EDITOR</span><h2>编辑提词稿</h2></div><button class="close" value="cancel" aria-label="关闭">×</button></div><p class="note">单独一行 P1、P2 表示分页，旧稿件的 --- 也可分页。行内 ↵ 强制换行。</p><textarea id="script-input" spellcheck="false" aria-label="提词稿内容"></textarea><div class="editor-bottom"><div class="file-actions"><button id="import" type="button">导入 TXT</button><button id="export" type="button">导出 TXT</button><button id="restore" type="button" hidden>恢复导入前稿件</button><input id="file" type="file" accept=".txt,text/plain" hidden></div><button id="save" class="primary" type="button">保存并返回</button></div></form></dialog>
<dialog id="settings-dialog"><form method="dialog" class="dialog-shell small"><div class="dialog-head"><div><span class="eyebrow">PROMPTER / SETTINGS</span><h2>提词设置</h2></div><button class="close" value="cancel" aria-label="关闭">×</button></div><div class="setting-row"><label for="countdown-select">开播倒计时</label><select id="countdown-select"><option value="0">关闭</option><option value="3">3 秒</option><option value="5">5 秒</option><option value="10">10 秒</option></select></div><div class="setting-row"><label for="prefix">分页标记前缀</label><input id="prefix" type="text" maxlength="8" autocomplete="off"></div><div class="setting-row"><label for="break-token">强制换行字符</label><input id="break-token" type="text" maxlength="8" autocomplete="off"></div><div class="setting-row"><label for="wake-lock">播放时保持屏幕常亮</label><input id="wake-lock" type="checkbox"></div><p class="note">常亮功能取决于浏览器支持；切换应用或锁屏后，浏览器可能暂停播放。</p><button id="save-settings" class="primary" type="button">保存设置</button></form></dialog>
<div id="toast" role="status" aria-live="polite"></div><script src="/tools/prompter/prompter.js" defer></script></body></html>
